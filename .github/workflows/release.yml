name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable

      - name: Build
        run: cargo build --locked --release

      - name: Bundle Windows
        shell: pwsh
        run: |
          $bundle = "dist/stick-fightt-windows-x86_64"
          New-Item -ItemType Directory -Path $bundle
          Copy-Item target/release/stick-fightt.exe, steam_appid.txt -Destination $bundle
          Copy-Item assets -Destination $bundle -Recurse
          $steam = Get-ChildItem target/release/build -Recurse -Filter steam_api64.dll | Select-Object -First 1
          Copy-Item $steam.FullName -Destination $bundle
          Compress-Archive -Path $bundle -DestinationPath "$bundle.zip"

      - uses: actions/upload-artifact@v4
        with:
          name: stick-fightt-windows-x86_64
          path: dist/stick-fightt-windows-x86_64.zip

  release:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - uses: softprops/action-gh-release@v2
        with:
          files: dist/*
          generate_release_notes: true
